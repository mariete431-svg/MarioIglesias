<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi lista de tareas · Mario Iglesias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="nav-shell">
      <nav id="nav">
        <a class="logo" href="index.html#inicio">MARIO IGLESIAS</a>
        <div class="nav-links">
          <a class="nav-link" href="index.html#proyectos">Volver a proyectos</a>
          <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
            <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
            <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </nav>
    </div>

    <main>
      <section class="tasks">
        <p class="status-badge">Proyecto · JavaScript</p>
        <h2 class="section-title">Mi lista de tareas</h2>
        <p class="intro" style="margin: 16px 0 30px;">
          Añade tareas, márcalas como hechas y bórralas cuando ya no las necesites.
          Todo se guarda en este navegador.
        </p>

        <form class="task-form" id="task-form">
          <input type="text" id="task-input" placeholder="Escribe una tarea nueva…" autocomplete="off" />
          <button type="submit" class="button">Añadir <span>→</span></button>
        </form>

        <p class="task-count" id="task-count"></p>
        <ul id="task-list"></ul>
      </section>

      <footer>
        <p>Hecho paso a paso.</p>
        <p id="year"></p>
      </footer>
    </main>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      const root = document.documentElement;
      const themeToggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme) root.setAttribute("data-theme", savedTheme);
      themeToggle.addEventListener("click", () => {
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });

      const nav = document.getElementById("nav");
      window.addEventListener("scroll", () => nav.classList.toggle("scrolled", window.scrollY > 8));

      const STORAGE_KEY = "mario-tareas";
      const form = document.getElementById("task-form");
      const input = document.getElementById("task-input");
      const list = document.getElementById("task-list");
      const count = document.getElementById("task-count");

      function loadTasks() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (error) {
          return [];
        }
      }
      function saveTasks(tasks) { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

      function updateCount(tasks) {
        const pending = tasks.filter((t) => !t.completed).length;
        if (tasks.length === 0) count.textContent = "Todavía no has añadido ninguna tarea.";
        else if (pending === 0) count.textContent = "Has completado todas tus tareas.";
        else count.textContent = `${pending} tarea${pending === 1 ? "" : "s"} pendiente${pending === 1 ? "" : "s"}`;
      }

      function render() {
        const tasks = loadTasks();
        list.innerHTML = "";
        tasks.forEach((task) => {
          const item = document.createElement("li");
          item.textContent = task.text;
          item.dataset.id = task.id;
          if (task.completed) item.classList.add("completed");
          item.addEventListener("click", () => toggleTask(task.id));

          const del = document.createElement("span");
          del.textContent = " ✕";
          del.style.float = "right";
          del.style.opacity = "0.6";
          del.addEventListener("click", (e) => { e.stopPropagation(); deleteTask(task.id); });
          item.appendChild(del);

          list.appendChild(item);
        });
        updateCount(tasks);
      }

      function addTask(text) {
        const tasks = loadTasks();
        tasks.push({ id: Date.now().toString(), text, completed: false });
        saveTasks(tasks);
        render();
      }
      function toggleTask(id) {
        const tasks = loadTasks().map((t) => (t.id === id ? { ...t, completed: !t.completed } : t));
        saveTasks(tasks);
        render();
      }
      function deleteTask(id) {
        saveTasks(loadTasks().filter((t) => t.id !== id));
        render();
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        addTask(text);
        input.value = "";
        input.focus();
      });

      render();
    </script>
  </body>
</html>
