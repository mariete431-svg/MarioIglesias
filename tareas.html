<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi lista de tareas · Mario Iglesias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="cursor-glow" id="cursor-glow"></div>

    <header class="site-header">
      <div class="nav">
        <a class="brand" href="index.html#inicio"><span class="brand-dot"></span>MARIO IGLESIAS</a>
        <a class="nav-contact" href="index.html#proyectos"><span>Volver a proyectos ↗</span></a>
      </div>
    </header>

    <main>
      <section class="task-page section">
        <p class="eyebrow reveal"><span class="eyebrow-line"></span>PROYECTO 02 — JAVASCRIPT</p>
        <h1 class="task-page-heading reveal">Mi lista de <span>tareas.</span></h1>
        <p class="task-page-description reveal">
          Añade tareas, márcalas como hechas y bórralas cuando ya no las necesites.
          Todo se guarda en este navegador.
        </p>

        <div class="task-card reveal">
          <form class="task-form" id="task-form">
            <input type="text" id="task-input" placeholder="Escribe una tarea nueva…" autocomplete="off" />
            <button type="submit" class="magnetic-button primary-button">
              <span>Añadir</span>
              <span class="button-arrow">→</span>
            </button>
          </form>

          <p class="task-count" id="task-count"></p>
          <ul id="task-list"></ul>
        </div>
      </section>

      <footer class="footer">
        <div>MARIO IGLESIAS</div>
        <div>Hecho paso a paso.</div>
        <div id="year"></div>
      </footer>
    </main>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      // Halo de cursor (igual que en el resto de la web)
      const glow = document.getElementById("cursor-glow");
      const isTouch = window.matchMedia("(hover: none)").matches;
      const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!isTouch && !prefersReduced) {
        window.addEventListener("mousemove", (e) => {
          glow.style.opacity = "1";
          glow.style.left = e.clientX + "px";
          glow.style.top = e.clientY + "px";
        });
        document.addEventListener("mouseleave", () => (glow.style.opacity = "0"));
      }

      // Revelado al hacer scroll (misma clase .reveal que usa el resto del sitio)
      const revealObserver = new IntersectionObserver(
        (entries) => entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            revealObserver.unobserve(entry.target);
          }
        }),
        { threshold: 0.12 }
      );
      document.querySelectorAll(".reveal").forEach((el, i) => {
        el.classList.add(`delay-${Math.min(i, 3)}`);
        revealObserver.observe(el);
      });

      // Lista de tareas
      const STORAGE_KEY = "mario-tareas";
      const form = document.getElementById("task-form");
      const input = document.getElementById("task-input");
      const list = document.getElementById("task-list");
      const count = document.getElementById("task-count");

      function loadTasks() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (error) {
          return [];
        }
      }
      function saveTasks(tasks) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function updateCount(tasks) {
        const pending = tasks.filter((t) => !t.completed).length;
        if (tasks.length === 0) count.textContent = "TODAVÍA NO HAY TAREAS";
        else if (pending === 0) count.textContent = "TODO COMPLETADO";
        else count.textContent = `${pending} PENDIENTE${pending === 1 ? "" : "S"} DE ${tasks.length}`;
      }

      function render() {
        const tasks = loadTasks();
        list.innerHTML = "";
        tasks.forEach((task) => {
          const item = document.createElement("li");
          item.dataset.id = task.id;
          if (task.completed) item.classList.add("completed");

          const check = document.createElement("span");
          check.className = "task-check" + (task.completed ? " checked" : "");
          check.textContent = task.completed ? "✓" : "○";

          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;

          const del = document.createElement("span");
          del.className = "task-delete";
          del.textContent = "eliminar";
          del.addEventListener("click", (e) => {
            e.stopPropagation();
            deleteTask(task.id);
          });

          item.append(check, text, del);
          item.addEventListener("click", () => toggleTask(task.id));
          list.appendChild(item);
        });
        updateCount(tasks);
      }

      function addTask(text) {
        const tasks = loadTasks();
        tasks.push({ id: Date.now().toString(), text, completed: false });
        saveTasks(tasks);
        render();
      }
      function toggleTask(id) {
        const tasks = loadTasks().map((t) => (t.id === id ? { ...t, completed: !t.completed } : t));
        saveTasks(tasks);
        render();
      }
      function deleteTask(id) {
        saveTasks(loadTasks().filter((t) => t.id !== id));
        render();
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        addTask(text);
        input.value = "";
        input.focus();
      });

      render();
    </script>
  </body>
</html>
